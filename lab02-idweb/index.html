<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="tarjeta">
    <h1>Registro de Estudiantes</h1>

    <form action="/procesar" method="POST">

        <fieldset>
            <legend>Datos Personales</legend>

            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" name="nombres" required minlength="2" maxlength="50" placeholder="Ingrese sus nombres">

            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" required minlength="2" maxlength="50" placeholder="Ingrese sus apellidos">

            <label for="codigo">Código de estudiante:</label>
            <input type="text" id="codigo" name="codigo" required pattern="[0-9]{8}" title="Ingrese exactamente 8 dígitos numéricos" placeholder="Ej: 20261234">

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" required min="16" max="60" placeholder="Ej: 18">

            <label for="fecha">Fecha de nacimiento:</label>
            <input type="date" id="fecha" name="fecha" required min="2000-01-01" max="2010-12-31">
        </fieldset>

        <fieldset>
            <legend>Datos de la Cuenta</legend>

            <label for="correo">Correo institucional:</label>
            <input type="email" id="correo" name="correo" required placeholder="usuario@universidad.edu.pe">

            <label for="clave">Contraseña:</label>
            <input type="password" id="clave" name="clave" required minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" title="Mínimo 8 caracteres, al menos una mayúscula y un número" placeholder="Mínimo 8 caracteres">

            <label for="carrera">Carrera profesional:</label>
            <select id="carrera" name="carrera" required>
                <option value="">Seleccione una opción</option>
                <option value="sistemas">Ingeniería de Sistemas</option>
                <option value="industrial">Ingeniería Industrial</option>
                <option value="administracion">Administración</option>
                <option value="contabilidad">Contabilidad</option>
                <option value="derecho">Derecho</option>
            </select>

            <label>Turno:</label>
            <div class="turnos">
                <label><input type="radio" name="turno" value="manana" required> Mañana</label>
                <label><input type="radio" name="turno" value="tarde"> Tarde</label>
                <label><input type="radio" name="turno" value="noche"> Noche</label>
            </div>

            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios" rows="3" maxlength="200" placeholder="Opcional"></textarea>

            <label class="terminos">
                <input type="checkbox" id="terminos" name="terminos" required>
                Acepto los términos y condiciones
            </label>
        </fieldset>

        <div class="botones">
            <button type="submit">Registrar</button>
            <button type="reset">Limpiar</button>
            <button type="button" disabled>Enviar después</button>
        </div>

    </form>
</div>

</body>
</html>
