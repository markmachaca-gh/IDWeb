<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes | Sistema Académico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <form action="/procesar" method="POST" class="card" id="formRegistro">
      <h1>Registro de Nuevos Estudiantes</h1>
      <p class="subtitulo">Complete los datos para crear su cuenta académica.</p>

      <!-- Bloque 1: Información Personal -->
      <fieldset>
        <legend>Información Personal</legend>

        <div class="form-group">
          <label for="nombres" class="form-label">Nombres:</label>
          <input type="text" id="nombres" name="nombres" class="form-input" required minlength="2" maxlength="60" placeholder="Ej. Ana María">
        </div>

        <div class="form-group">
          <label for="apellidos" class="form-label">Apellidos:</label>
          <input type="text" id="apellidos" name="apellidos" class="form-input" required minlength="2" maxlength="60" placeholder="Ej. Pérez Gómez">
        </div>

        <div class="form-group">
          <label for="codigo" class="form-label">Código de estudiante (8 dígitos):</label>
          <input type="text" id="codigo" name="codigo" class="form-input" required pattern="[0-9]{8}" minlength="8" maxlength="8" inputmode="numeric" placeholder="20261234" title="Ingrese exactamente 8 dígitos numéricos.">
        </div>

        <div class="form-group">
          <label for="fechaNacimiento" class="form-label">Fecha de nacimiento:</label>
          <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="form-input" required min="2000-01-01" max="2010-12-31" title="La fecha debe estar entre 2000-01-01 y 2010-12-31.">
        </div>
      </fieldset>

      <!-- Bloque 2: Información de la Cuenta -->
      <fieldset>
        <legend>Información de la Cuenta</legend>

        <div class="form-group">
          <label for="email" class="form-label">Correo institucional:</label>
          <input type="email" id="email" name="email" class="form-input" required placeholder="usuario@universidad.edu.pe" title="Ingrese un correo institucional válido.">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña:</label>
          <input type="password" id="password" name="password" class="form-input" required minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" title="Mínimo 8 caracteres, al menos una mayúscula y un número." placeholder="Mínimo 8 caracteres">
        </div>

        <div class="form-group">
          <label for="carrera" class="form-label">Carrera profesional:</label>
          <select id="carrera" name="carrera" class="form-input" required>
            <option value="" disabled selected>Seleccione una carrera</option>
            <option value="ingenieria-sistemas">Ingeniería de Sistemas</option>
            <option value="ingenieria-industrial">Ingeniería Industrial</option>
            <option value="administracion">Administración</option>
            <option value="contabilidad">Contabilidad</option>
            <option value="derecho">Derecho</option>
          </select>
        </div>

        <div class="form-group">
          <span class="form-label">Turno:</span>
          <div class="radio-group">
            <label><input type="radio" name="turno" value="manana" required> Mañana</label>
            <label><input type="radio" name="turno" value="tarde"> Tarde</label>
            <label><input type="radio" name="turno" value="noche"> Noche</label>
          </div>
        </div>

        <div class="form-group">
          <label for="comentarios" class="form-label">Comentarios:</label>
          <textarea id="comentarios" name="comentarios" class="form-input" rows="4" maxlength="300" placeholder="Ingrese observaciones adicionales (opcional)."></textarea>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="terminos" name="terminos" required>
            Acepto los términos y condiciones del sistema académico.
          </label>
        </div>
      </fieldset>

      <div class="acciones">
        <button type="submit" class="btn btn-primary">Registrar</button>
        <button type="reset" class="btn btn-secondary">Limpiar</button>
        <button type="button" class="btn btn-disabled" disabled>Enviar luego</button>
      </div>
    </form>
  </main>
</body>
</html>
